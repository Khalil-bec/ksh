name : tester
on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test :
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: tester
        run: |
          pytest -v